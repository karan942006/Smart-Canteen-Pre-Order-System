<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Canteen Pre-Order System</title>
<style>
:root{
  --slate:#1f2b27;
  --green:#2f6f4f;
  --green-light:#4f9d74;
  --amber:#f2a93b;
  --cream:#fbf6ec;
  --paper:#fffdf7;
  --line:#d8cfb8;
  --red:#d9534f;
  --ink:#2a2a2a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
}
.font-display{font-family:Georgia,'Times New Roman',serif;}

/* ===== Topbar ===== */
.topbar{
  background:var(--slate);
  color:var(--cream);
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
  position:sticky;top:0;z-index:50;
}
.brand{
  display:flex;align-items:center;gap:12px;
}
.brand .badge{
  width:42px;height:42px;border-radius:50%;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}
.brand h1{font-size:1.25rem;font-weight:700;font-family:Georgia,serif;}
.brand span{font-size:0.75rem;opacity:0.75;display:block;}

.nav-tabs{display:flex;gap:8px;}
.nav-tabs button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.25);
  color:var(--cream);
  padding:8px 16px;
  border-radius:20px;
  cursor:pointer;
  font-size:0.85rem;
  transition:all .25s ease;
}
.nav-tabs button:hover{background:rgba(255,255,255,0.1);}
.nav-tabs button.active{
  background:var(--amber);
  color:var(--slate);
  border-color:var(--amber);
  font-weight:600;
}

.user-area{display:flex;align-items:center;gap:10px;font-size:0.85rem;}
.user-area button{
  background:var(--green);
  border:none;color:#fff;padding:8px 14px;
  border-radius:20px;cursor:pointer;
  font-size:0.8rem;transition:background .2s;
}
.user-area button:hover{background:var(--green-light);}

/* ===== Layout ===== */
.container{max-width:1100px;margin:0 auto;padding:24px;}
.hidden{display:none !important;}

/* ===== Auth screens ===== */
.auth-wrap{
  display:flex;justify-content:center;align-items:center;
  min-height:80vh;
  padding:20px;
}
.auth-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:36px;
  width:100%;
  max-width:400px;
  box-shadow:0 10px 30px rgba(47,111,79,0.08);
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
.auth-card h2{
  font-family:Georgia,serif;
  color:var(--green);
  margin-bottom:6px;
  font-size:1.6rem;
}
.auth-card p.sub{color:#777;font-size:0.85rem;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:6px;color:var(--slate);}
.field input,.field select{
  width:100%;padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:0.9rem;
  background:#fff;
  transition:border-color .2s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);}
.btn-primary{
  width:100%;padding:11px;
  background:var(--green);color:#fff;
  border:none;border-radius:8px;
  font-size:0.95rem;font-weight:600;
  cursor:pointer;transition:background .2s, transform .15s;
}
.btn-primary:hover{background:var(--green-light);transform:translateY(-1px);}
.switch-link{
  text-align:center;margin-top:16px;font-size:0.85rem;color:#666;
}
.switch-link a{color:var(--green);font-weight:600;cursor:pointer;text-decoration:none;}
.switch-link a:hover{text-decoration:underline;}
.error-msg{
  background:#fdecea;color:var(--red);
  padding:8px 12px;border-radius:6px;
  font-size:0.8rem;margin-bottom:12px;
  display:none;
}
.role-toggle{
  display:flex;gap:8px;margin-bottom:18px;
  background:var(--cream);border-radius:10px;padding:4px;
}
.role-toggle button{
  flex:1;padding:8px;border:none;background:transparent;
  border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:600;
  color:#777;transition:all .2s;
}
.role-toggle button.active{background:var(--green);color:#fff;}

/* ===== Section headers ===== */
.section-title{
  font-family:Georgia,serif;
  color:var(--slate);
  font-size:1.4rem;
  margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';
  width:6px;height:24px;background:var(--amber);
  border-radius:3px;display:inline-block;
}

/* ===== Menu grid ===== */
.menu-controls{
  display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center;
}
.menu-controls input[type=text]{
  flex:1;min-width:180px;padding:10px 14px;
  border:1px solid var(--line);border-radius:24px;
  font-size:0.9rem;background:#fff;
}
.menu-controls input[type=text]:focus{outline:none;border-color:var(--green);}
.cat-filters{display:flex;gap:6px;flex-wrap:wrap;}
.cat-filters button{
  padding:7px 14px;border-radius:18px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:0.8rem;transition:all .2s;
}
.cat-filters button.active{background:var(--amber);border-color:var(--amber);font-weight:600;}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}
.food-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  display:flex;flex-direction:column;gap:8px;
  transition:transform .25s ease, box-shadow .25s ease;
  animation:fadeUp .4s ease;
}
.food-card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 20px rgba(47,111,79,0.12);
}
.food-emoji{font-size:2.2rem;}
.food-card h3{font-size:1.05rem;color:var(--slate);}
.food-card .cat-tag{
  font-size:0.7rem;color:var(--green);
  background:rgba(47,111,79,0.1);
  display:inline-block;padding:2px 8px;border-radius:10px;
  width:fit-content;font-weight:600;
}
.food-card .price{font-size:1.1rem;font-weight:700;color:var(--amber);}
.food-card .unavailable-tag{
  font-size:0.7rem;color:var(--red);font-weight:700;
}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:auto;}
.qty-row button{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--line);background:#fff;cursor:pointer;
  font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.qty-row button:hover{background:var(--cream);}
.qty-row .qty-val{font-weight:600;min-width:20px;text-align:center;}
.add-btn{
  background:var(--green);color:#fff;border:none;
  padding:8px 0;border-radius:8px;cursor:pointer;
  font-size:0.85rem;font-weight:600;transition:background .2s;
  margin-top:6px;
}
.add-btn:hover{background:var(--green-light);}
.add-btn:disabled{background:#ccc;cursor:not-allowed;}

/* ===== Cart ===== */
.cart-fab{
  position:fixed;bottom:24px;right:24px;
  background:var(--amber);color:var(--slate);
  border-radius:30px;padding:14px 22px;
  font-weight:700;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  display:flex;align-items:center;gap:10px;
  z-index:60;transition:transform .2s;
  border:none;font-size:0.95rem;
}
.cart-fab:hover{transform:scale(1.05);}
.cart-fab .count{
  background:var(--red);color:#fff;border-radius:50%;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;
}
.cart-panel{
  position:fixed;top:0;right:0;height:100vh;width:340px;max-width:90vw;
  background:var(--paper);box-shadow:-8px 0 24px rgba(0,0,0,0.15);
  z-index:70;transform:translateX(100%);
  transition:transform .35s ease;
  display:flex;flex-direction:column;
}
.cart-panel.open{transform:translateX(0);}
.cart-header{
  padding:18px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.cart-header h3{font-family:Georgia,serif;color:var(--green);}
.cart-header button{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#999;}
.cart-items{flex:1;overflow-y:auto;padding:14px 18px;}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:0.9rem;
}
.cart-item .name{flex:1;}
.cart-item .meta{color:#888;font-size:0.78rem;}
.cart-item button.remove{
  background:none;border:none;color:var(--red);cursor:pointer;font-size:0.85rem;
}
.cart-footer{padding:18px;border-top:1px solid var(--line);}
.cart-total{
  display:flex;justify-content:space-between;font-weight:700;
  margin-bottom:12px;font-size:1.05rem;color:var(--slate);
}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.35);
  z-index:65;opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto;}

/* ===== Orders / Tracking ===== */
.order-card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:12px;padding:18px;margin-bottom:16px;
  animation:fadeUp .4s ease;
}
.order-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.token-chip{
  background:var(--slate);color:var(--amber);
  font-family:'Courier New',monospace;font-weight:700;
  padding:6px 12px;border-radius:6px;font-size:0.9rem;
  letter-spacing:1px;
}
.order-items-list{font-size:0.85rem;color:#555;margin:8px 0;}
.order-total{font-weight:700;color:var(--green);}

/* progress tracker */
.progress-track{
  display:flex;justify-content:space-between;position:relative;margin:22px 0 6px;
}
.progress-track::before{
  content:'';position:absolute;top:11px;left:0;right:0;height:3px;
  background:var(--line);z-index:0;
}
.progress-fill{
  position:absolute;top:11px;left:0;height:3px;background:var(--green);
  z-index:1;transition:width .6s ease;
}
.step{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:6px;font-size:0.7rem;color:#999;flex:1;
}
.step .dot{
  width:24px;height:24px;border-radius:50%;background:#fff;
  border:3px solid var(--line);transition:all .4s ease;
}
.step.done .dot{border-color:var(--green);background:var(--green);}
.step.current .dot{
  border-color:var(--amber);background:var(--amber);
  animation:ringpulse 1.5s infinite;
}
@keyframes ringpulse{
  0%{box-shadow:0 0 0 0 rgba(242,169,59,0.6);}
  70%{box-shadow:0 0 0 8px rgba(242,169,59,0);}
  100%{box-shadow:0 0 0 0 rgba(242,169,59,0);}
}
.step.done,.step.current{color:var(--slate);font-weight:600;}

/* status badge */
.status-badge{
  display:inline-block;padding:4px 12px;border-radius:14px;
  font-size:0.75rem;font-weight:700;color:#fff;
}
.status-Pending{background:#999;}
.status-Accepted{background:#5b8def;}
.status-Preparing{background:var(--amber);color:var(--slate);}
.status-Ready{background:var(--green-light);}
.status-Delivered{background:var(--green);}

/* ===== Admin ===== */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:16px;text-align:center;
  animation:fadeUp .4s ease;
}
.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--green);font-family:Georgia,serif;}
.stat-card .lbl{font-size:0.75rem;color:#888;margin-top:4px;}

.admin-table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden;}
.admin-table th,.admin-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:0.85rem;}
.admin-table th{background:var(--slate);color:var(--cream);font-weight:600;}
.admin-table tr:hover{background:rgba(47,111,79,0.04);}
.admin-table select{padding:6px 8px;border-radius:6px;border:1px solid var(--line);}
.small-btn{
  padding:5px 10px;border-radius:6px;border:none;cursor:pointer;
  font-size:0.75rem;font-weight:600;color:#fff;margin-right:4px;
}
.small-btn.edit{background:#5b8def;}
.small-btn.del{background:var(--red);}
.small-btn.toggle{background:var(--green);}

.add-food-form{
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:18px;margin-bottom:24px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;align-items:end;
}
.add-food-form .field{margin-bottom:0;}
.add-food-form .btn-primary{padding:10px;}

.tab-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-row button{
  padding:8px 16px;border-radius:18px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:0.85rem;transition:all .2s;
}
.tab-row button.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600;}

.empty-state{
  text-align:center;color:#999;padding:40px 0;font-size:0.95rem;
}
/* ===== Modals ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center;
  z-index:90;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-card{
  background:var(--paper);border-radius:14px;
  width:100%;max-width:380px;max-height:90vh;overflow-y:auto;
  padding:26px;box-shadow:0 16px 40px rgba(0,0,0,0.25);
  transform:translateY(20px) scale(0.98);transition:transform .3s ease;
}
.modal-overlay.show .modal-card{transform:translateY(0) scale(1);}
.modal-card h2{font-family:Georgia,serif;color:var(--green);margin-bottom:6px;font-size:1.4rem;}
.modal-card p.sub{color:#777;font-size:0.85rem;margin-bottom:18px;}

/* payment methods */
.pay-methods{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.pay-method{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--line);border-radius:10px;padding:12px;
  cursor:pointer;font-size:0.9rem;transition:all .2s;
}
.pay-method:hover{border-color:var(--green-light);}
.pay-method.selected{border-color:var(--green);background:rgba(47,111,79,0.06);font-weight:600;}
.pay-method input{accent-color:var(--green);}
.pay-summary{
  background:var(--cream);border-radius:10px;padding:12px;
  font-size:0.85rem;margin-bottom:18px;
}
.pay-summary .row{display:flex;justify-content:space-between;padding:3px 0;}
.pay-summary .row.total{font-weight:700;color:var(--slate);border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;}

.processing{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:30px 0;
}
.spinner{
  width:42px;height:42px;border-radius:50%;
  border:4px solid var(--line);border-top-color:var(--green);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* bill */
.bill-success-icon{
  width:60px;height:60px;border-radius:50%;background:var(--green);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;margin:0 auto 12px;
  animation:popIn .4s ease;
}
@keyframes popIn{
  from{transform:scale(0.4);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
.bill-paper{
  border:1px dashed var(--line);border-radius:10px;
  padding:16px;font-family:'Courier New',monospace;font-size:0.82rem;
  margin:14px 0;background:#fff;
}
.bill-paper .bh{text-align:center;margin-bottom:8px;}
.bill-paper .bh strong{font-size:1rem;font-family:'Courier New',monospace;}
.bill-paper hr{border:none;border-top:1px dashed var(--line);margin:8px 0;}
.bill-row{display:flex;justify-content:space-between;}
.bill-row.total{font-weight:700;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions .btn-primary{flex:1;}
.btn-secondary{
  flex:1;padding:11px;background:#fff;color:var(--green);
  border:1px solid var(--green);border-radius:8px;font-weight:600;
  font-size:0.95rem;cursor:pointer;transition:all .2s;
}
.btn-secondary:hover{background:var(--cream);}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--slate);color:#fff;padding:12px 24px;border-radius:24px;
  font-size:0.9rem;box-shadow:0 6px 16px rgba(0,0,0,0.2);
  opacity:0;transition:all .35s ease;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:640px){
  .topbar{flex-direction:column;align-items:flex-start;}
  .nav-tabs{width:100%;overflow-x:auto;}
}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;}
}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="role-toggle">
      <button id="roleStudentBtn" class="active" onclick="setAuthRole('student')">🎓 Student</button>
      <button id="roleAdminBtn" onclick="setAuthRole('admin')">👨‍🍳 Canteen Staff</button>
    </div>

    <div id="errorBox" class="error-msg"></div>

    <!-- LOGIN -->
    <div id="loginForm">
      <h2 id="loginTitle">Welcome Back</h2>
      <p class="sub">Sign in to order ahead and skip the queue.</p>
      <div class="field"><label>Email</label><input type="text" id="loginEmail" placeholder="you@college.edu"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="handleLogin()">Login</button>
      <div class="switch-link" id="studentSwitchLink">New here? <a onclick="showRegister()">Create a student account</a></div>
      <div class="switch-link" style="margin-top:6px;font-size:0.75rem;">Demo admin → admin@canteen.edu / admin123</div>
    </div>

    <!-- REGISTER (student only) -->
    <div id="registerForm" class="hidden">
      <h2>Create Account</h2>
      <p class="sub">Register to start pre-ordering your meals.</p>
      <div class="field"><label>Full Name</label><input type="text" id="regName" placeholder="Aarav Sharma"></div>
      <div class="field"><label>Email</label><input type="text" id="regEmail" placeholder="you@college.edu"></div>
      <div class="field"><label>Mobile Number</label><input type="text" id="regMobile" placeholder="9876543210"></div>
      <div class="field"><label>Password</label><input type="password" id="regPassword" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="handleRegister()">Register</button>
      <div class="switch-link">Already have an account? <a onclick="showLogin()">Login here</a></div>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="hidden">
  <div class="topbar">
    <div class="brand">
      <div class="badge">🍽️</div>
      <div>
        <h1>Smart Canteen Pre-Order</h1>
        <span id="welcomeMsg">Welcome!</span>
      </div>
    </div>

    <div class="nav-tabs" id="navTabs"></div>

    <div class="user-area">
      <span id="userLabel"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container" id="mainContainer"></div>
</div>

<!-- ============ CART PANEL ============ -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>🧾 Your Cart</h3>
    <button onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Total</span><span id="cartTotal">₹0</span></div>
    <button class="btn-primary" id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
  </div>
</div>

<button class="cart-fab hidden" id="cartFab" onclick="openCart()">
  🛒 Cart <span class="count" id="cartCount">0</span>
</button>

<div class="toast" id="toast"></div>

<!-- PAYMENT MODAL -->
<div class="modal-overlay" id="paymentOverlay">
  <div class="modal-card" id="paymentCard">
    <!-- content injected by JS -->
  </div>
</div>

<!-- BILL MODAL -->
<div class="modal-overlay" id="billOverlay">
  <div class="modal-card" id="billCard">
    <!-- content injected by JS -->
  </div>
</div>

<script>
/* =========================================================
   DATA LAYER (in-memory, resets on reload — demo purposes)
========================================================= */
let students = [
  {Student_ID:1, Name:'Demo Student', Email:'student@college.edu', Mobile_Number:'9999999999', Password:'student123'}
];
let nextStudentId = 2;

const ADMIN = {Email:'admin@canteen.edu', Password:'admin123', Name:'Canteen Staff'};

let foods = [
  {Food_ID:1, Food_Name:'Veg Sandwich', Category:'Snacks', Price:40, Availability:true, emoji:'🥪'},
  {Food_ID:2, Food_Name:'Masala Dosa', Category:'Breakfast', Price:50, Availability:true, emoji:'🥞'},
  {Food_ID:3, Food_Name:'Veg Biryani', Category:'Lunch', Price:90, Availability:true, emoji:'🍛'},
  {Food_ID:4, Food_Name:'Paneer Roll', Category:'Snacks', Price:60, Availability:true, emoji:'🌮'},
  {Food_ID:5, Food_Name:'Cold Coffee', Category:'Beverages', Price:35, Availability:true, emoji:'🥤'},
  {Food_ID:6, Food_Name:'Samosa (2pc)', Category:'Snacks', Price:20, Availability:true, emoji:'🥟'},
  {Food_ID:7, Food_Name:'Veg Thali', Category:'Lunch', Price:100, Availability:false, emoji:'🍱'},
  {Food_ID:8, Food_Name:'Masala Chai', Category:'Beverages', Price:15, Availability:true, emoji:'☕'},
];
let nextFoodId = 9;

let orders = []; // {Order_ID, Student_ID, Order_Date, Total_Amount, Status, Token_Number, items:[{Food_ID,Food_Name,Quantity,Price}]}
let nextOrderId = 101;
let nextToken = 501;

const STATUS_STEPS = ['Pending','Accepted','Preparing','Ready','Delivered'];

/* =========================================================
   STATE
========================================================= */
let authRole = 'student';
let currentUser = null; // {type:'student'|'admin', ...data}
let cart = {}; // Food_ID -> qty
let currentTab = '';
let menuSearch = '';
let menuCategory = 'All';
let adminFoodTab = 'menu';

/* =========================================================
   HELPERS
========================================================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmt(n){ return '₹'+n.toFixed(0); }

/* =========================================================
   AUTH
========================================================= */
function setAuthRole(role){
  authRole = role;
  document.getElementById('roleStudentBtn').classList.toggle('active', role==='student');
  document.getElementById('roleAdminBtn').classList.toggle('active', role==='admin');
  document.getElementById('studentSwitchLink').style.display = role==='student' ? 'block':'none';
  document.getElementById('loginTitle').textContent = role==='student' ? 'Welcome Back' : 'Staff Login';
  showLogin();
}
function showRegister(){
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
  hideError();
}
function showLogin(){
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('registerForm').classList.add('hidden');
  hideError();
}
function showError(msg){
  const e = document.getElementById('errorBox');
  e.textContent = msg;
  e.style.display = 'block';
}
function hideError(){
  document.getElementById('errorBox').style.display = 'none';
}

function handleLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  hideError();
  if(!email || !pass){ showError('Please enter email and password.'); return; }

  if(authRole === 'admin'){
    if(email === ADMIN.Email && pass === ADMIN.Password){
      currentUser = {type:'admin', Name: ADMIN.Name, Email: ADMIN.Email};
      enterApp();
    } else {
      showError('Invalid staff credentials.');
    }
  } else {
    const s = students.find(s=>s.Email===email && s.Password===pass);
    if(s){
      currentUser = {type:'student', ...s};
      cart = {};
      enterApp();
    } else {
      showError('Invalid email or password.');
    }
  }
}

function handleRegister(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const mobile = document.getElementById('regMobile').value.trim();
  const pass = document.getElementById('regPassword').value;
  hideError();
  if(!name||!email||!mobile||!pass){ showError('Please fill in all fields.'); return; }
  if(students.find(s=>s.Email===email)){ showError('An account with this email already exists.'); return; }
  const newStudent = {Student_ID:nextStudentId++, Name:name, Email:email, Mobile_Number:mobile, Password:pass};
  students.push(newStudent);
  showToast('Account created! Please log in.');
  showLogin();
  document.getElementById('loginEmail').value = email;
}

function logout(){
  currentUser = null;
  cart = {};
  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('cartFab').classList.add('hidden');
  closeCart();
  showLogin();
  document.getElementById('loginEmail').value='';
  document.getElementById('loginPassword').value='';
}

function enterApp(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  document.getElementById('userLabel').textContent = currentUser.Name;
  document.getElementById('welcomeMsg').textContent =
    currentUser.type==='admin' ? 'Canteen Staff Dashboard' : `Hi ${currentUser.Name.split(' ')[0]}, what's on the menu today?`;

  if(currentUser.type==='student'){
    document.getElementById('cartFab').classList.remove('hidden');
    buildNav([
      {id:'menu', label:'🍽️ Menu'},
      {id:'orders', label:'📦 My Orders'},
    ]);
    currentTab = 'menu';
  } else {
    document.getElementById('cartFab').classList.add('hidden');
    buildNav([
      {id:'dashboard', label:'📊 Dashboard'},
      {id:'orders', label:'📦 Manage Orders'},
      {id:'foods', label:'🍱 Manage Menu'},
    ]);
    currentTab = 'dashboard';
  }
  renderTab();
}

function buildNav(tabs){
  const nav = document.getElementById('navTabs');
  nav.innerHTML = '';
  tabs.forEach(t=>{
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.onclick = ()=>{ currentTab=t.id; renderTab(); };
    btn.dataset.tab = t.id;
    nav.appendChild(btn);
  });
}

function highlightNav(){
  document.querySelectorAll('#navTabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===currentTab);
  });
}

/* =========================================================
   TAB ROUTER
========================================================= */
function renderTab(){
  highlightNav();
  const c = document.getElementById('mainContainer');
  if(currentUser.type==='student'){
    if(currentTab==='menu') c.innerHTML = renderMenu();
    else if(currentTab==='orders') c.innerHTML = renderStudentOrders();
  } else {
    if(currentTab==='dashboard') c.innerHTML = renderAdminDashboard();
    else if(currentTab==='orders') c.innerHTML = renderAdminOrders();
    else if(currentTab==='foods') c.innerHTML = renderAdminFoods();
  }
  renderCart();
}

/* =========================================================
   STUDENT: MENU
========================================================= */
function renderMenu(){
  const categories = ['All', ...new Set(foods.map(f=>f.Category))];
  let filtered = foods.filter(f=>{
    const matchSearch = f.Food_Name.toLowerCase().includes(menuSearch.toLowerCase());
    const matchCat = menuCategory==='All' || f.Category===menuCategory;
    return matchSearch && matchCat;
  });

  let html = `<div class="section-title">Today's Menu</div>
  <div class="menu-controls">
    <input type="text" placeholder="🔍 Search food items..." value="${menuSearch}" oninput="onSearch(this.value)">
    <div class="cat-filters">`;
  categories.forEach(cat=>{
    html += `<button class="${cat===menuCategory?'active':''}" onclick="onCategory('${cat}')">${cat}</button>`;
  });
  html += `</div></div><div class="menu-grid">`;

  if(filtered.length===0){
    html += `<div class="empty-state">No dishes match your search. Try a different keyword.</div>`;
  }

  filtered.forEach(f=>{
    const qty = cart[f.Food_ID] || 0;
    html += `<div class="food-card">
      <div class="food-emoji">${f.emoji||'🍴'}</div>
      <h3>${f.Food_Name}</h3>
      <span class="cat-tag">${f.Category}</span>
      <div class="price">${fmt(f.Price)}</div>
      ${!f.Availability ? '<span class="unavailable-tag">Currently unavailable</span>' : ''}
      <div class="qty-row">
        <button onclick="changeQty(${f.Food_ID},-1)" ${!f.Availability?'disabled':''}>−</button>
        <span class="qty-val">${qty}</span>
        <button onclick="changeQty(${f.Food_ID},1)" ${!f.Availability?'disabled':''}>+</button>
      </div>
      <button class="add-btn" onclick="addToCart(${f.Food_ID})" ${!f.Availability?'disabled':''}>
        ${!f.Availability ? 'Unavailable' : (qty>0 ? `Add ${qty} to cart`:'Add to cart')}
      </button>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function onSearch(val){ menuSearch = val; renderTab(); }
function onCategory(cat){ menuCategory = cat; renderTab(); }

// temp quantity selector before adding (kept in cart directly for simplicity)
let tempQty = {};
function changeQty(foodId, delta){
  const food = foods.find(f=>f.Food_ID===foodId);
  let q = (tempQty[foodId]||0) + delta;
  if(q<0) q=0;
  tempQty[foodId] = q;
  // reflect in UI immediately
  document.querySelectorAll('.food-card').forEach(card=>{
    if(card.querySelector('h3').textContent===food.Food_Name){
      card.querySelector('.qty-val').textContent = q;
      const btn = card.querySelector('.add-btn');
      if(food.Availability) btn.textContent = q>0?`Add ${q} to cart`:'Add to cart';
    }
  });
}
function addToCart(foodId){
  const q = tempQty[foodId]||1;
  if(q<=0){ showToast('Select at least 1 quantity.'); return; }
  cart[foodId] = (cart[foodId]||0) + q;
  tempQty[foodId] = 0;
  showToast('Added to cart!');
  renderCart();
}

/* =========================================================
   CART
========================================================= */
function renderCart(){
  const itemsEl = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartTotal');
  const countEl = document.getElementById('cartCount');
  if(!itemsEl) return;

  const entries = Object.entries(cart).filter(([id,q])=>q>0);
  let total = 0, count = 0;
  if(entries.length===0){
    itemsEl.innerHTML = `<div class="empty-state">Your cart is empty.<br>Add something tasty! 🍔</div>`;
  } else {
    itemsEl.innerHTML = entries.map(([id,qty])=>{
      const food = foods.find(f=>f.Food_ID===Number(id));
      total += food.Price*qty;
      count += qty;
      return `<div class="cart-item">
        <div>
          <div class="name">${food.emoji} ${food.Food_Name}</div>
          <div class="meta">${fmt(food.Price)} × ${qty} = ${fmt(food.Price*qty)}</div>
        </div>
        <button class="remove" onclick="removeFromCart(${food.Food_ID})">Remove</button>
      </div>`;
    }).join('');
  }
  totalEl.textContent = fmt(total);
  countEl.textContent = count;

  const placeBtn = document.getElementById('placeOrderBtn');
  placeBtn.disabled = entries.length===0;
  placeBtn.style.opacity = entries.length===0 ? 0.6 : 1;
}
function removeFromCart(foodId){
  delete cart[foodId];
  renderCart();
}
function openCart(){
  document.getElementById('cartPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeCart(){
  document.getElementById('cartPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
let selectedPayMethod = 'upi';
let pendingOrderItems = null;
let pendingOrderTotal = 0;

function placeOrder(){
  const entries = Object.entries(cart).filter(([id,q])=>q>0);
  if(entries.length===0) return;
  let total = 0;
  const items = entries.map(([id,qty])=>{
    const food = foods.find(f=>f.Food_ID===Number(id));
    total += food.Price*qty;
    return {Food_ID:food.Food_ID, Food_Name:food.Food_Name, Quantity:qty, Price:food.Price, emoji:food.emoji};
  });
  pendingOrderItems = items;
  pendingOrderTotal = total;
  closeCart();
  openPaymentModal();
}

/* =========================================================
   PAYMENT MODAL
========================================================= */
const PAY_METHODS = [
  {id:'upi', label:'📱 UPI (GPay / PhonePe / Paytm)'},
  {id:'card', label:'💳 Credit / Debit Card'},
  {id:'wallet', label:'👛 Canteen Wallet'},
  {id:'cod', label:'💰 Pay at Counter (Cash)'},
];

function openPaymentModal(){
  selectedPayMethod = 'upi';
  renderPaymentCard();
  document.getElementById('paymentOverlay').classList.add('show');
}
function closePaymentModal(){
  document.getElementById('paymentOverlay').classList.remove('show');
}
function renderPaymentCard(){
  const card = document.getElementById('paymentCard');
  card.innerHTML = `
    <h2>💳 Choose Payment</h2>
    <p class="sub">This is a demo payment — no real transaction will occur.</p>
    <div class="pay-summary">
      ${pendingOrderItems.map(it=>`<div class="row"><span>${it.emoji} ${it.Food_Name} ×${it.Quantity}</span><span>${fmt(it.Price*it.Quantity)}</span></div>`).join('')}
      <div class="row total"><span>Total Payable</span><span>${fmt(pendingOrderTotal)}</span></div>
    </div>
    <div class="pay-methods">
      ${PAY_METHODS.map(m=>`
        <label class="pay-method ${m.id===selectedPayMethod?'selected':''}" onclick="selectPayMethod('${m.id}')">
          <input type="radio" name="paymethod" value="${m.id}" ${m.id===selectedPayMethod?'checked':''}>
          ${m.label}
        </label>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closePaymentModal()">Cancel</button>
      <button class="btn-primary" onclick="processPayment()">Pay ${fmt(pendingOrderTotal)}</button>
    </div>
  `;
}
function selectPayMethod(id){
  selectedPayMethod = id;
  renderPaymentCard();
}
function processPayment(){
  const card = document.getElementById('paymentCard');
  card.innerHTML = `
    <div class="processing">
      <div class="spinner"></div>
      <div style="font-weight:600;color:var(--slate);">Processing payment...</div>
      <div style="font-size:0.8rem;color:#888;">Please don't close this window</div>
    </div>`;
  setTimeout(()=>{
    finalizeOrderAfterPayment();
  }, 1300);
}

/* =========================================================
   FINALIZE ORDER + BILL
========================================================= */
function finalizeOrderAfterPayment(){
  const order = {
    Order_ID: nextOrderId++,
    Student_ID: currentUser.Student_ID,
    Order_Date: new Date(),
    Total_Amount: pendingOrderTotal,
    Status: 'Pending',
    Token_Number: 'T'+(nextToken++),
    items: pendingOrderItems,
    Payment_Method: PAY_METHODS.find(m=>m.id===selectedPayMethod).label,
    Payment_ID: 'PAY'+Math.floor(100000+Math.random()*900000)
  };
  orders.push(order);
  cart = {};
  tempQty = {};
  renderCart();

  closePaymentModal();
  openBillModal(order);

  currentTab = 'orders';
  renderTab();
}

function openBillModal(order){
  const card = document.getElementById('billCard');
  const dt = order.Order_Date;
  card.innerHTML = `
    <div style="text-align:center;">
      <div class="bill-success-icon">✓</div>
      <h2 style="text-align:center;">Payment Successful</h2>
      <p class="sub" style="text-align:center;">Your order has been placed.</p>
    </div>

    <div class="bill-paper" id="printArea">
      <div class="bh">
        <strong>🍽️ Smart Canteen</strong><br>
        <span style="font-size:0.75rem;">Pre-Order Receipt</span>
      </div>
      <hr>
      <div class="bill-row"><span>Order ID</span><span>#${order.Order_ID}</span></div>
      <div class="bill-row"><span>Token No.</span><span>${order.Token_Number}</span></div>
      <div class="bill-row"><span>Student</span><span>${currentUser.Name}</span></div>
      <div class="bill-row"><span>Date</span><span>${dt.toLocaleDateString()}</span></div>
      <div class="bill-row"><span>Time</span><span>${dt.toLocaleTimeString()}</span></div>
      <hr>
      ${order.items.map(it=>`
        <div class="bill-row"><span>${it.Food_Name} x${it.Quantity}</span><span>${fmt(it.Price*it.Quantity)}</span></div>
      `).join('')}
      <hr>
      <div class="bill-row total"><span>Total Paid</span><span>${fmt(order.Total_Amount)}</span></div>
      <hr>
      <div class="bill-row"><span>Payment Mode</span><span>${order.Payment_Method}</span></div>
      <div class="bill-row"><span>Payment ID</span><span>${order.Payment_ID}</span></div>
      <div style="text-align:center;margin-top:10px;font-size:0.75rem;">Thank you! Show token at counter.</div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="printBill()">🖨️ Print Bill</button>
      <button class="btn-primary" onclick="closeBillModal()">Done</button>
    </div>
  `;
  document.getElementById('billOverlay').classList.add('show');
}
function closeBillModal(){
  document.getElementById('billOverlay').classList.remove('show');
}
function printBill(){
  window.print();
}


/* =========================================================
   STUDENT: ORDER HISTORY / TRACKING
========================================================= */
function renderStudentOrders(){
  const myOrders = orders.filter(o=>o.Student_ID===currentUser.Student_ID).slice().reverse();
  let html = `<div class="section-title">My Orders</div>`;
  if(myOrders.length===0){
    html += `<div class="empty-state">No orders yet. Head to the Menu tab and place your first order! 🍽️</div>`;
    return html;
  }
  myOrders.forEach(o=>{
    const stepIndex = STATUS_STEPS.indexOf(o.Status);
    const fillPct = (stepIndex/(STATUS_STEPS.length-1))*100;
    html += `<div class="order-card">
      <div class="order-top">
        <div><strong>Order #${o.Order_ID}</strong><br>
          <span style="font-size:0.8rem;color:#888;">${o.Order_Date.toLocaleString()}</span>
        </div>
        <div style="text-align:right;">
          <div class="token-chip">🎫 ${o.Token_Number}</div>
          <button class="small-btn toggle" style="margin-top:6px;" onclick="openBillModal(orders.find(x=>x.Order_ID===${o.Order_ID}))">View Bill</button>
        </div>
      </div>
      <div class="order-items-list">
        ${o.items.map(it=>`${it.emoji} ${it.Food_Name} ×${it.Quantity}`).join(', ')}
      </div>
      <div class="order-total">Total: ${fmt(o.Total_Amount)}</div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${fillPct}%"></div>
        ${STATUS_STEPS.map((s,i)=>`
          <div class="step ${i<stepIndex?'done':(i===stepIndex?'current':'')}">
            <div class="dot"></div><span>${s}</span>
          </div>`).join('')}
      </div>
    </div>`;
  });
  return html;
}

/* =========================================================
   ADMIN: DASHBOARD
========================================================= */
function renderAdminDashboard(){
  const totalOrders = orders.length;
  const pending = orders.filter(o=>o.Status!=='Delivered').length;
  const today = new Date().toDateString();
  const todayOrders = orders.filter(o=>o.Order_Date.toDateString()===today);
  const revenue = todayOrders.reduce((sum,o)=>sum+o.Total_Amount,0);
  const totalStudents = students.length;

  let html = `<div class="section-title">Canteen Overview</div>
  <div class="admin-grid">
    <div class="stat-card"><div class="num">${totalOrders}</div><div class="lbl">Total Orders</div></div>
    <div class="stat-card"><div class="num">${pending}</div><div class="lbl">Active / Pending Orders</div></div>
    <div class="stat-card"><div class="num">${fmt(revenue)}</div><div class="lbl">Today's Revenue</div></div>
    <div class="stat-card"><div class="num">${totalStudents}</div><div class="lbl">Registered Students</div></div>
    <div class="stat-card"><div class="num">${foods.filter(f=>f.Availability).length}/${foods.length}</div><div class="lbl">Items Available</div></div>
  </div>
  <div class="section-title">Recent Orders</div>`;

  const recent = orders.slice().reverse().slice(0,5);
  if(recent.length===0){
    html += `<div class="empty-state">No orders placed yet today.</div>`;
  } else {
    html += `<table class="admin-table"><tr><th>Token</th><th>Order ID</th><th>Items</th><th>Total</th><th>Status</th></tr>`;
    recent.forEach(o=>{
      html += `<tr>
        <td>${o.Token_Number}</td>
        <td>#${o.Order_ID}</td>
        <td>${o.items.map(it=>it.Food_Name+' x'+it.Quantity).join(', ')}</td>
        <td>${fmt(o.Total_Amount)}</td>
        <td><span class="status-badge status-${o.Status}">${o.Status}</span></td>
      </tr>`;
    });
    html += `</table>`;
  }
  return html;
}

/* =========================================================
   ADMIN: MANAGE ORDERS
========================================================= */
function renderAdminOrders(){
  let html = `<div class="section-title">Manage Orders</div>`;
  const all = orders.slice().reverse();
  if(all.length===0){
    html += `<div class="empty-state">No orders to manage yet.</div>`;
    return html;
  }
  html += `<table class="admin-table"><tr><th>Token</th><th>Order ID</th><th>Student</th><th>Items</th><th>Total</th><th>Status</th><th>Update</th></tr>`;
  all.forEach(o=>{
    const student = students.find(s=>s.Student_ID===o.Student_ID);
    html += `<tr>
      <td><span class="token-chip" style="font-size:0.8rem;">${o.Token_Number}</span></td>
      <td>#${o.Order_ID}</td>
      <td>${student?student.Name:'Unknown'}</td>
      <td>${o.items.map(it=>it.Food_Name+' x'+it.Quantity).join(', ')}</td>
      <td>${fmt(o.Total_Amount)}</td>
      <td><span class="status-badge status-${o.Status}">${o.Status}</span></td>
      <td>
        <select onchange="updateOrderStatus(${o.Order_ID}, this.value)">
          ${STATUS_STEPS.map(s=>`<option value="${s}" ${s===o.Status?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
    </tr>`;
  });
  html += `</table>`;
  return html;
}
function updateOrderStatus(orderId, status){
  const o = orders.find(o=>o.Order_ID===orderId);
  if(o){ o.Status = status; showToast(`Order #${orderId} marked as ${status}`); renderTab(); }
}

/* =========================================================
   ADMIN: MANAGE FOODS
========================================================= */
function renderAdminFoods(){
  let html = `<div class="section-title">Manage Menu</div>
  <div class="add-food-form">
    <div class="field"><label>Food Name</label><input type="text" id="newFoodName" placeholder="e.g. Veg Burger"></div>
    <div class="field"><label>Category</label><input type="text" id="newFoodCategory" placeholder="e.g. Snacks"></div>
    <div class="field"><label>Price (₹)</label><input type="number" id="newFoodPrice" placeholder="50"></div>
    <div class="field"><label>Emoji (optional)</label><input type="text" id="newFoodEmoji" placeholder="🍔"></div>
    <button class="btn-primary" onclick="addFood()">+ Add Item</button>
  </div>
  <table class="admin-table"><tr><th>Food ID</th><th>Name</th><th>Category</th><th>Price</th><th>Availability</th><th>Actions</th></tr>`;
  foods.forEach(f=>{
    html += `<tr>
      <td>${f.Food_ID}</td>
      <td>${f.emoji||''} ${f.Food_Name}</td>
      <td>${f.Category}</td>
      <td><input type="number" value="${f.Price}" style="width:70px;padding:4px;border:1px solid var(--line);border-radius:6px;" onchange="updatePrice(${f.Food_ID}, this.value)"></td>
      <td><span class="status-badge ${f.Availability?'status-Delivered':'status-Pending'}">${f.Availability?'Available':'Unavailable'}</span></td>
      <td>
        <button class="small-btn toggle" onclick="toggleAvailability(${f.Food_ID})">${f.Availability?'Disable':'Enable'}</button>
        <button class="small-btn del" onclick="deleteFood(${f.Food_ID})">Delete</button>
      </td>
    </tr>`;
  });
  html += `</table>`;
  return html;
}
function addFood(){
  const name = document.getElementById('newFoodName').value.trim();
  const cat = document.getElementById('newFoodCategory').value.trim();
  const price = parseFloat(document.getElementById('newFoodPrice').value);
  const emoji = document.getElementById('newFoodEmoji').value.trim() || '🍴';
  if(!name||!cat||isNaN(price)||price<=0){ showToast('Please fill all fields with valid values.'); return; }
  foods.push({Food_ID:nextFoodId++, Food_Name:name, Category:cat, Price:price, Availability:true, emoji:emoji});
  showToast(`${name} added to menu!`);
  renderTab();
}
function updatePrice(foodId, val){
  const f = foods.find(f=>f.Food_ID===foodId);
  const price = parseFloat(val);
  if(!isNaN(price) && price>0){ f.Price = price; showToast('Price updated.'); }
}
function toggleAvailability(foodId){
  const f = foods.find(f=>f.Food_ID===foodId);
  f.Availability = !f.Availability;
  renderTab();
}
function deleteFood(foodId){
  foods = foods.filter(f=>f.Food_ID!==foodId);
  delete cart[foodId];
  showToast('Item removed from menu.');
  renderTab();
}

/* init */
showLogin();
</script>
</body>
</html>
